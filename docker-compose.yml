services:
  db:
    image: postgres:17
    container_name: healthopz-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: healthcare_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"

  healthopz:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthopz
    env_file:
      - ./Backend/.env
    depends_on:
      - db
    ports:
      - "80:10000"
    restart: unless-stopped

volumes:
  postgres_data: